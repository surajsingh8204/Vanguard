version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: vanguard-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: vanguard
      POSTGRES_PASSWORD: vanguard123
      POSTGRES_DB: vanguard_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data: